name: Build Android APK and PWA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build PWA
      run: npm run build

    - name: Copy PWA to releases
      run: |
        rm -rf releases/pwa
        mkdir -p releases/pwa
        cp -r dist/* releases/pwa/

    - name: Build web for Android
      run: npm run build:android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create gradle.properties
      run: |
        echo "org.gradle.jvmargs=-Xmx2048m" > android/gradle.properties
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.nonTransitiveRClass=true" >> android/gradle.properties

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Copy APK to releases
      run: |
        mkdir -p releases/android
        cp android/app/build/outputs/apk/debug/app-debug.apk releases/android/MinhasContas-debug.apk

    - name: Commit and push release artifacts
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add releases/
        git diff --cached --quiet || git commit -m "chore(releases): update android apk and pwa artifacts [skip ci]"
        git push
