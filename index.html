    <script>
      // Fix for "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // This happens when some libraries try to polyfill fetch by assignment.
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) { console.warn('Attempt to overwrite fetch ignored'); },
              configurable: true
            });
          }
        } catch (e) {
          // If we can't define it, it's already non-configurable.
        }
      })();
    </script>

  </body>
